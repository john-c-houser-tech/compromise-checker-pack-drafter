# CI: lint and tests. No secrets, nothing spent: the tests answer every feed and
# the AI with made-up data. The network: package installs, and the public checker
# and packs repositories, read only, so the copied pack format and the detection
# vocabulary are compared with the checker at their pinned commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.15"]  # floor, and the newest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: The checker and the signed packs, beside this repository
        run: |
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/john-c-houser-tech/compromise-checker.git ../compromise-checker
          git clone --quiet --depth 1 \
            https://github.com/john-c-houser-tech/compromise-checker-packs.git ../compromise-checker-packs
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest -q -rs  # -rs: a skipped comparison with the checker shows
