[build-system]
requires = ["setuptools>=77"]  # SPDX licence fields (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "drafter"
dynamic = ["version"]
description = "Drafts Compromise Checker threat packs from public vendor data"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# Feeds are read with the standard library; PyYAML reads signed packs (A.3).
dependencies = ["PyYAML>=6.0.3"]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.14"]

[project.scripts]
drafter = "drafter.cli:main"

[tool.setuptools.dynamic]
version = { attr = "drafter.__version__" }

[tool.setuptools.packages.find]
include = ["drafter*"]

[tool.setuptools.package-data]
# The set-aside list (plan D3) and the third-party watch list, read at run time.
drafter = ["setaside.toml", "thirdparty.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]  # asserts; /tmp paths as data
